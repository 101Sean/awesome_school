<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <h1 class="font-bold text-base">관리 대시보드</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span class="text-slate-400 hidden sm:inline">관리자: {{ request.user.username }}</span>
                <a href="/" class="text-slate-300 hover:text-white transition">신청 페이지 보기</a>
                <a href="/admin/" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold transition">
                    Django Admin
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <!-- 요약 통계 -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-400 uppercase">전체 신청</p>
                <p class="text-2xl font-extrabold text-slate-900 mt-1">{{ total_count }}건</p>
            </div>
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-blue-500 uppercase">접수</p>
                <p class="text-2xl font-extrabold text-blue-600 mt-1">{{ received_count }}건</p>
            </div>
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-amber-500 uppercase">확인중</p>
                <p class="text-2xl font-extrabold text-amber-600 mt-1">{{ reviewing_count }}건</p>
            </div>
            <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-emerald-500 uppercase">완료</p>
                <p class="text-2xl font-extrabold text-emerald-600 mt-1">{{ completed_count }}건</p>
            </div>
        </div>

        <!-- 필터 및 액션 바 -->
        <div class="bg-white rounded-t-2xl border border-slate-200 p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2" id="filter-tabs">
                <button onclick="filterApplications('')" data-status=""
                    class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-white">
                    전체
                </button>
                <button onclick="filterApplications('RECEIVED')" data-status="RECEIVED"
                    class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">
                    접수
                </button>
                <button onclick="filterApplications('REVIEWING')" data-status="REVIEWING"
                    class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">
                    확인중
                </button>
                <button onclick="filterApplications('COMPLETED')" data-status="COMPLETED"
                    class="filter-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">
                    완료
                </button>
            </div>

            <div class="flex items-center gap-2">
                <span id="toast-msg" class="text-xs font-semibold text-emerald-600 hidden">저장되었습니다.</span>
                <button onclick="triggerReminders()"
                    class="px-3.5 py-1.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition">
                    안내 메일 일괄 발송
                </button>
                <button onclick="exportToSheets()"
                    class="px-3.5 py-1.5 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 transition">
                    Google 시트 내보내기
                </button>
                <button onclick="loadApplications(currentStatus)"
                    class="px-3.5 py-1.5 rounded-lg border border-slate-300 text-sm font-medium text-slate-700 hover:bg-slate-50">
                    새로고침
                </button>
            </div>
        </div>

        <!-- 신청 목록 테이블 -->
        <div class="bg-white rounded-b-2xl border-x border-b border-slate-200 shadow-sm overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                        <th class="py-3.5 px-4">ID</th>
                        <th class="py-3.5 px-4">신청 교육 과정</th>
                        <th class="py-3.5 px-4">신청자 / 이메일</th>
                        <th class="py-3.5 px-4">주소</th>
                        <th class="py-3.5 px-4">연락 가능일</th>
                        <th class="py-3.5 px-4">진행 상태</th>
                        <th class="py-3.5 px-4 text-right">관리</th>
                    </tr>
                </thead>
                <tbody id="application-tbody" class="divide-y divide-slate-100 text-sm">
                    <!-- JS 동적 렌더링 -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let currentStatus = '';

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        }

        function showToast(text) {
            const el = document.getElementById('toast-msg');
            el.textContent = text;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2000);
        }

        function filterApplications(status) {
            currentStatus = status;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isActive = btn.dataset.status === status;
                btn.className = isActive
                    ? 'filter-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-white'
                    : 'filter-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200';
            });
            loadApplications(status);
        }

        async function loadApplications(status = '') {
            const url = status ? `/api/applications/?status=${status}` : '/api/applications/';
            const res = await fetch(url);
            const data = await res.json();
            const tbody = document.getElementById('application-tbody');

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-12 text-center text-slate-400">해당 조건의 신청 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(app => `
                <tr class="hover:bg-slate-50/80 transition">
                    <td class="py-3.5 px-4 font-mono text-xs text-slate-400">#${app.id}</td>
                    <td class="py-3.5 px-4 font-semibold text-slate-900">${app.program_title}</td>
                    <td class="py-3.5 px-4">
                        <div class="font-medium text-slate-900">${app.applicant_name}</div>
                        <div class="text-xs text-slate-500">${app.email}</div>
                    </td>
                    <td class="py-3.5 px-4 text-slate-600 max-w-xs truncate" title="${app.address}">${app.address}</td>
                    <td class="py-3.5 px-4 font-medium text-slate-700">${app.available_date}</td>
                    <td class="py-3.5 px-4">
                        <select onchange="updateStatus(${app.id}, this.value)"
                            class="rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs font-bold bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="RECEIVED" ${app.status === 'RECEIVED' ? 'selected' : ''}>접수</option>
                            <option value="REVIEWING" ${app.status === 'REVIEWING' ? 'selected' : ''}>확인중</option>
                            <option value="COMPLETED" ${app.status === 'COMPLETED' ? 'selected' : ''}>완료</option>
                        </select>
                    </td>
                    <td class="py-3.5 px-4 text-right">
                        <button onclick="deleteApplication(${app.id})"
                            class="px-2.5 py-1 rounded-md text-xs font-semibold text-rose-600 hover:bg-rose-50 transition">
                            삭제
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, newStatus) {
            const res = await fetch(`/api/applications/${id}/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ status: newStatus }),
            });
            if (res.ok) {
                showToast('상태가 변경되었습니다.');
                setTimeout(() => location.reload(), 600);
            }
        }

        async function deleteApplication(id) {
            if (!confirm('정말 이 신청 내역을 삭제하시겠습니까?')) return;
            const res = await fetch(`/api/applications/${id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
            });
            if (res.ok) {
                location.reload();
            }
        }

        async function triggerReminders() {
            const targetDate = prompt(
                '안내 메일 발송 기준 날짜를 입력하세요 (YYYY-MM-DD).\n비워두고 확인을 누르면 오늘 날짜 기준으로 실행됩니다.',
                new Date().toISOString().split('T')[0]
            );
            if (targetDate === null) return;

            const res = await fetch('/api/applications/actions/send-reminders/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ date: targetDate.trim() }),
            });
            const data = await res.json();
            alert(data.message);
            loadApplications(currentStatus);
        }

        async function exportToSheets() {
            const res = await fetch('/api/applications/actions/export-sheets/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
            });
            const data = await res.json();
            alert(data.message);
            if (data.spreadsheet_url) {
                window.open(data.spreadsheet_url, '_blank');
            }
        }

        loadApplications();
    </script>
</body>
</html>
